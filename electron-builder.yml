appId: com.kayor.prismcaststudio
productName: PrismCast Studio
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - target/release/prismcast.exe
  - package.json
asar: true
compression: maximum
win:
  target:
    - target: portable
      arch: [x64]
  icon: build/icon.ico
  artifactName: PrismCast-Studio-${version}.${ext}
portable:
  # Caminho de extracao fixo: sem isso o exe cai em %TEMP%\<uuid> diferente a cada
  # execucao e a regra de firewall (indexada por caminho) precisa ser recriada sempre.
  unpackDirName: prismcast-studio
  artifactName: PrismCast-Studio-${version}.${ext}
