[package]
name = "prismcast"
version = "2.4.0"
edition = "2021"
authors = ["kayor"]
description = "PrismCast Studio — Motor nativo em Rust para transmissão LAN P2P, Multistreaming (Twitch, YouTube, Kick, TikTok), Dual Output (16:9 + 9:16), Replay Buffer e Widgets"
license = "MIT"

[[bin]]
name = "prismcast"
path = "src-rust/main.rs"

[[bin]]
name = "prismcast-audio"
path = "src-rust/audio_helper.rs"

[lib]
name = "prismcast_core"
path = "src-rust/lib.rs"

[dependencies]
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "net", "sync", "time", "process", "io-util", "signal", "fs"] }
tokio-util = "0.7"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
bytes = "1.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
url = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex-lite = "0.1"
uuid = { version = "1.12", features = ["v4", "serde"] }
socket2 = { version = "0.6", features = ["all"] }
if-addrs = "0.13"
subtle = "2.6"
rand = "0.9"
chrono = "0.4"
log = "0.4"
env_logger = "0.11"
dirs = "6.0"
hostname = "0.4"
base64 = "0.22"
keyring = "3.6"

[target.'cfg(windows)'.dependencies]
wasapi = "0.26"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Networking_WinSock",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
