name: PrismCast Studio CI/CD

on:
  push:
    branches: [master, main]
    tags:
      - 'v*'
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-test:
    name: Validar & Testar (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar dependências de sistema Linux (Tauri v2 / WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache de dependências do Rust
        uses: Swatinem/rust-cache@v2

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências Node
        run: npm ci

      - name: Verificar tipos TypeScript e compilar frontend
        run: npm run build

      - name: Rodar testes unitários em Rust (headless)
        run: cargo test --verbose

      - name: Rodar testes unitários e verificar integração Tauri v2
        run: cargo test --features tauri-app --verbose

      - name: Verificar todos os alvos Rust com Tauri v2
        run: cargo check --all-targets --features tauri-app

  build-windows:
    name: Build Windows (Tauri v2 — Portable .exe, NSIS, MSI)
    needs: validate-and-test
    runs-on: windows-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache de dependências do Rust
        uses: Swatinem/rust-cache@v2

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências Node
        run: npm ci

      - name: Gerar instaladores e executável Windows (Tauri v2 + Rust)
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Preparar artefatos Windows para publicação
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = node -p "require('./package.json').version"
          New-Item -ItemType Directory -Force -Path release-windows | Out-Null
          Copy-Item "target/release/prismcast.exe" "release-windows/PrismCast-Studio-$version-windows-x64-portable.exe"
          $nsis = @(Get-ChildItem "target/release/bundle/nsis/*.exe")
          $msi = @(Get-ChildItem "target/release/bundle/msi/*.msi")
          if ($nsis.Count -eq 0) { throw "Nenhum instalador NSIS encontrado em target/release/bundle/nsis" }
          if ($msi.Count -eq 0) { throw "Nenhum instalador MSI encontrado em target/release/bundle/msi" }
          foreach ($item in ($nsis + $msi)) {
            $safeName = $item.Name -replace ' ', '-'
            Copy-Item $item.FullName "release-windows/$safeName"
          }
          Get-ChildItem release-windows/

      - name: Publicar artefatos Windows
        uses: actions/upload-artifact@v4
        with:
          name: PrismCast-Studio-Windows
          path: release-windows/*
          if-no-files-found: error

  build-linux:
    name: Build Linux (Tauri v2 — AppImage, deb, rpm, tar.gz)
    needs: validate-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar dependências Tauri v2 e empacotamento Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf rpm libarchive-tools squashfs-tools libfuse2

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache de dependências do Rust
        uses: Swatinem/rust-cache@v2

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências Node
        run: npm ci

      - name: Gerar pacotes Linux (AppImage, .deb, .rpm)
        run: npm run dist:linux
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Preparar artefatos Linux para publicação
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p release-linux
          for f in target/release/bundle/appimage/*.AppImage target/release/bundle/deb/*.deb target/release/bundle/rpm/*.rpm; do
            base=$(basename "$f")
            cp "$f" "release-linux/${base// /-}"
          done
          tar -czf "release-linux/PrismCast-Studio-${VERSION}-linux-x64.tar.gz" -C target/release prismcast prismcast-audio
          ls -lh release-linux/

      - name: Publicar artefatos Linux
        uses: actions/upload-artifact@v4
        with:
          name: PrismCast-Studio-Linux
          path: release-linux/*
          if-no-files-found: error

  publish-release:
    name: Publicar Release no GitHub (Windows + Linux)
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Baixar artefato Windows
        uses: actions/download-artifact@v4
        with:
          name: PrismCast-Studio-Windows
          path: release-assets

      - name: Baixar artefatos Linux
        uses: actions/download-artifact@v4
        with:
          name: PrismCast-Studio-Linux
          path: release-assets

      - name: Criar ou atualizar Release no GitHub com todos os pacotes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${VERSION}"
          fi

          echo "Gerando manifesto SHA256SUMS.txt para verificação do atualizador automático..."
          (
            cd release-assets
            rm -f SHA256SUMS.txt
            sha256sum * > SHA256SUMS.txt
          )

          echo "Artefatos prontos para publicação na release ${TAG}:"
          ls -lh release-assets/
          cat release-assets/SHA256SUMS.txt

          if [[ -f ".github/RELEASE_NOTES.md" ]]; then
            NOTES_ARGS=(--notes-file ".github/RELEASE_NOTES.md")
          else
            NOTES_ARGS=(--generate-notes)
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Atualizando release existente ${TAG}..."
            gh release upload "${TAG}" release-assets/* --clobber
            if [[ -f ".github/RELEASE_NOTES.md" ]]; then
              gh release edit "${TAG}" --draft=false --title "PrismCast Studio ${TAG} (Windows & Linux)" --notes-file ".github/RELEASE_NOTES.md"
            else
              gh release edit "${TAG}" --draft=false --title "PrismCast Studio ${TAG} (Windows & Linux)"
            fi
          else
            echo "Criando nova release ${TAG}..."
            gh release create "${TAG}" release-assets/* \
              --title "PrismCast Studio ${TAG} (Windows & Linux)" \
              "${NOTES_ARGS[@]}"
          fi
