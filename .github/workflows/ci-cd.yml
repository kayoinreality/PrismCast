name: PrismCast Studio CI/CD

on:
  push:
    branches: [master, main]
    tags:
      - 'v*'
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-test:
    name: Validar & Testar (Rust + TypeScript)
    runs-on: windows-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache de dependências do Rust
        uses: Swatinem/rust-cache@v2

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências Node
        run: npm ci

      - name: Rodar testes unitários em Rust
        run: cargo test --verbose

      - name: Verificar tipos TypeScript
        run: npm run typecheck

      - name: Compilar Rust em modo Release
        run: cargo build --release

  release:
    name: Gerar executável e publicar Release
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: validate-and-test
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache de dependências do Rust
        uses: Swatinem/rust-cache@v2

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências Node
        run: npm ci

      - name: Gerar executável portátil Windows (Electron + Rust)
        run: npm run dist
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publicar artefato de compilação
        uses: actions/upload-artifact@v4
        with:
          name: PrismCast-Studio-Windows
          path: dist/*.exe
          if-no-files-found: error

      - name: Criar ou atualizar Release no GitHub
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = if ($env:GITHUB_REF -like "refs/tags/v*") { $env:GITHUB_REF_NAME } else { "v$version" }
          $artifact = Get-ChildItem -Path dist -Filter '*.exe' | Select-Object -First 1
          if (-not $artifact) { throw 'O executável de distribuição não foi encontrado em dist/.' }
          
          Write-Host "Verificando se release $tag já existe..."
          $exists = $false
          try {
            gh release view $tag 2>$null
            if ($LASTEXITCODE -eq 0) { $exists = $true }
          } catch {
            $exists = $false
          }
          
          if ($exists) {
            Write-Host "Atualizando release existente $tag..."
            gh release upload $tag $artifact.FullName --clobber
          } else {
            Write-Host "Criando nova release $tag..."
            gh release create $tag $artifact.FullName --title "PrismCast Studio $tag" --generate-notes
          }
