name: PrismCast Studio CI/CD

on:
  push:
    branches: [master, main]
    tags:
      - 'v*'
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-test:
    name: Validar & Testar (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar dependências de sistema Linux (X11 / Wayland / Vulkan / OpenSSL)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libxkbcommon-dev libwayland-dev libx11-dev libxcb-shape0-dev libxcb-xfixes0-dev libdbus-1-dev

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache de dependências do Rust
        uses: Swatinem/rust-cache@v2

      - name: Rodar testes unitários em Rust (headless)
        run: cargo test --no-default-features --verbose

      - name: Rodar testes unitários com UI nativa Rust (egui + wgpu)
        run: cargo test --verbose

      - name: Verificar todos os alvos Rust (binários + testes)
        run: cargo check --all-targets

  build-windows:
    name: Build Windows (100% Rust — Portable .exe & Instalador NSIS)
    needs: validate-and-test
    runs-on: windows-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache de dependências do Rust
        uses: Swatinem/rust-cache@v2

      - name: Compilar binários nativos Windows (Release)
        run: cargo build --release --bins

      - name: Gerar Portable .exe e Instalador NSIS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force -Path release-windows | Out-Null

          Copy-Item "target/release/prismcast.exe" "release-windows/PrismCast-Studio-$version-windows-x64-portable.exe"
          Compress-Archive -Path "target/release/prismcast.exe","target/release/prismcast-audio.exe" -DestinationPath "release-windows/PrismCast-Studio-$version-windows-x64-portable.zip" -Force

          makensis /DAPP_VERSION=$version build/installer/prismcast.nsi
          Get-ChildItem release-windows/

      - name: Publicar artefatos Windows
        uses: actions/upload-artifact@v4
        with:
          name: PrismCast-Studio-Windows
          path: release-windows/*
          if-no-files-found: error

  build-linux:
    name: Build Linux (100% Rust — .deb & .tar.gz)
    needs: validate-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar dependências de build Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libxkbcommon-dev libwayland-dev libx11-dev libxcb-shape0-dev libxcb-xfixes0-dev libdbus-1-dev dpkg

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache de dependências do Rust
        uses: Swatinem/rust-cache@v2

      - name: Compilar binários nativos Linux (Release)
        run: cargo build --release --bins

      - name: Empacotar .deb e .tar.gz
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')
          mkdir -p release-linux

          # Pacote .tar.gz portátil
          tar -czf "release-linux/PrismCast-Studio-${VERSION}-linux-x64.tar.gz" -C target/release prismcast prismcast-audio

          # Pacote .deb nativo com ícone e atalho de menu
          PKG_DIR="target/deb-pkg"
          rm -rf "${PKG_DIR}"
          mkdir -p "${PKG_DIR}/DEBIAN" \
                   "${PKG_DIR}/usr/bin" \
                   "${PKG_DIR}/usr/share/applications" \
                   "${PKG_DIR}/usr/share/icons/hicolor/256x256/apps"

          install -m 755 target/release/prismcast "${PKG_DIR}/usr/bin/prismcast"
          install -m 755 target/release/prismcast-audio "${PKG_DIR}/usr/bin/prismcast-audio"
          install -m 644 build/128x128@2x.png "${PKG_DIR}/usr/share/icons/hicolor/256x256/apps/prismcast.png"

          cat > "${PKG_DIR}/usr/share/applications/prismcast-studio.desktop" <<'EOF'
          [Desktop Entry]
          Name=PrismCast Studio
          Comment=Estúdio de transmissão 100% nativo em Rust (egui + wgpu)
          Exec=/usr/bin/prismcast
          Icon=prismcast
          Terminal=false
          Type=Application
          Categories=AudioVideo;Video;Recorder;
          EOF

          cat > "${PKG_DIR}/DEBIAN/control" <<EOF
          Package: prismcast-studio
          Version: ${VERSION}
          Section: video
          Priority: optional
          Architecture: amd64
          Maintainer: kayor <kayor@users.noreply.github.com>
          Description: PrismCast Studio — Estúdio de transmissão 100% nativo em Rust
           Estúdio desktop nativo em Rust (egui + wgpu) com captura nativa sem WebView,
           Dual Output 16:9 + 9:16, Multistreaming RTMP, Mixer DSP 48 kHz e LAN P2P.
          EOF

          dpkg-deb --build "${PKG_DIR}" "release-linux/PrismCast-Studio-${VERSION}-amd64.deb"
          ls -lh release-linux/

      - name: Publicar artefatos Linux
        uses: actions/upload-artifact@v4
        with:
          name: PrismCast-Studio-Linux
          path: release-linux/*
          if-no-files-found: error

  publish-release:
    name: Publicar Release no GitHub (Windows + Linux)
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Baixar artefato Windows
        uses: actions/download-artifact@v4
        with:
          name: PrismCast-Studio-Windows
          path: release-assets

      - name: Baixar artefatos Linux
        uses: actions/download-artifact@v4
        with:
          name: PrismCast-Studio-Linux
          path: release-assets

      - name: Criar ou atualizar Release no GitHub com todos os pacotes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${VERSION}"
          fi

          echo "Gerando manifesto SHA256SUMS.txt para verificação do atualizador automático..."
          (
            cd release-assets
            rm -f SHA256SUMS.txt
            sha256sum * > SHA256SUMS.txt
          )

          echo "Artefatos prontos para publicação na release ${TAG}:"
          ls -lh release-assets/
          cat release-assets/SHA256SUMS.txt

          if [[ -f ".github/RELEASE_NOTES.md" ]]; then
            NOTES_ARGS=(--notes-file ".github/RELEASE_NOTES.md")
          else
            NOTES_ARGS=(--generate-notes)
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Atualizando release existente ${TAG}..."
            gh release upload "${TAG}" release-assets/* --clobber
            if [[ -f ".github/RELEASE_NOTES.md" ]]; then
              gh release edit "${TAG}" --draft=false --title "PrismCast Studio ${TAG} (Windows & Linux)" --notes-file ".github/RELEASE_NOTES.md"
            else
              gh release edit "${TAG}" --draft=false --title "PrismCast Studio ${TAG} (Windows & Linux)"
            fi
          else
            echo "Criando nova release ${TAG}..."
            gh release create "${TAG}" release-assets/* \
              --title "PrismCast Studio ${TAG} (Windows & Linux)" \
              "${NOTES_ARGS[@]}"
          fi
