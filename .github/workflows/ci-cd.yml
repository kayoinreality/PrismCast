name: PrismCast Studio CI/CD

on:
  push:
    branches: [master, main]
    tags:
      - 'v*'
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-test:
    name: Validar & Testar (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache de dependências do Rust
        uses: Swatinem/rust-cache@v2

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências Node
        run: npm ci

      - name: Rodar testes unitários em Rust
        run: cargo test --verbose

      - name: Verificar tipos TypeScript
        run: npm run typecheck

      - name: Compilar Rust em modo Release
        run: cargo build --release

  build-windows:
    name: Build Windows (Portable .exe)
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: validate-and-test
    runs-on: windows-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache de dependências do Rust
        uses: Swatinem/rust-cache@v2

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências Node
        run: npm ci

      - name: Gerar executável portátil Windows (Electron + Rust)
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publicar artefato Windows
        uses: actions/upload-artifact@v4
        with:
          name: PrismCast-Studio-Windows
          path: dist/*.exe
          if-no-files-found: error

  build-linux:
    name: Build Linux (AppImage, deb, rpm, pacman, tar.gz)
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: validate-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar ferramentas de empacotamento Linux (rpm, pacman/bsdtar, AppImage)
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools squashfs-tools libfuse2

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache de dependências do Rust
        uses: Swatinem/rust-cache@v2

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências Node
        run: npm ci

      - name: Gerar pacotes Linux (AppImage, .deb, .rpm, .pacman, .tar.gz)
        run: npm run dist:linux
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publicar artefatos Linux
        uses: actions/upload-artifact@v4
        with:
          name: PrismCast-Studio-Linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.pacman
            dist/*.tar.gz
          if-no-files-found: error

  publish-release:
    name: Publicar Release no GitHub (Windows + Linux)
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Baixar artefato Windows
        uses: actions/download-artifact@v4
        with:
          name: PrismCast-Studio-Windows
          path: release-assets

      - name: Baixar artefatos Linux
        uses: actions/download-artifact@v4
        with:
          name: PrismCast-Studio-Linux
          path: release-assets

      - name: Criar ou atualizar Release no GitHub com todos os pacotes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${VERSION}"
          fi

          echo "Artefatos prontos para publicação na release ${TAG}:"
          ls -lh release-assets/

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Atualizando release existente ${TAG}..."
            gh release upload "${TAG}" release-assets/* --clobber
            gh release edit "${TAG}" --draft=false --title "PrismCast Studio ${TAG} (Windows & Linux)"
          else
            echo "Criando nova release ${TAG}..."
            gh release create "${TAG}" release-assets/* \
              --title "PrismCast Studio ${TAG} (Windows & Linux)" \
              --generate-notes
          fi
